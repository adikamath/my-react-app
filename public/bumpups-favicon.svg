<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bumpups Icon</title>
  <desc id="desc">A gradient rounded-square favicon with ascending white bars and arrow mark, matching the Bumpups Test logo.</desc>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00CEC9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon container -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" rx="40" ry="40" width="216" height="216" fill="url(#grad)" filter="url(#shadow)"/>
    <g transform="translate(60,60) scale(1.1)">
      <rect x="0" y="70" width="30" height="40" rx="8" fill="white" opacity="0.9"/>
      <rect x="45" y="48" width="30" height="62" rx="8" fill="white" opacity="0.95"/>
      <rect x="90" y="24" width="30" height="86" rx="8" fill="white" opacity="1"/>
      <path d="M78 36 L128 0 L120 32 L150 38 L96 58 Z" fill="white"/>
    </g>
  </g>
</svg>

