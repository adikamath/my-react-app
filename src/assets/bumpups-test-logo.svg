<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="220" viewBox="0 0 720 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tubestamp Logo</title>
  <desc id="desc">A modern logo for Tubestamp, combining a play button and timestamp ring with sleek gradient text.</desc>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon: circular timestamp ring + play triangle -->
  <g transform="translate(30,30)">
    <circle cx="80" cy="80" r="70" stroke="url(#grad)" stroke-width="12" fill="none" filter="url(#shadow)"/>
    <polygon points="70,50 110,80 70,110" fill="url(#grad)" filter="url(#shadow)"/>
    <!-- Small stamp notch -->
    <circle cx="150" cy="80" r="6" fill="url(#grad)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(220, 95)">
    <text x="0" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="800" fill="url(#grad)" letter-spacing="0.5">
      Tubestamp
    </text>
  </g>
</svg>
